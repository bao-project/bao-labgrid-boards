# In setup.cfg, not pyproject.toml: the pip of Ubuntu 22.04 builds with the
# system's setuptools, which is too old to read project metadata from there.
[metadata]
name = labgrid-bao-boards
version = 0.4.0
description = labgrid drivers and boot strategies for the boards Bao runs on
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0

[options]
packages = find:
python_requires = >=3.9
install_requires =
    labgrid>=25.0

[options.extras_require]
tapo =
    python-kasa>=0.7
